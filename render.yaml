services:
  - type: web
    name: adscale-app
    runtime: node
    plan: starter
    region: oregon
    rootDir: app
    branch: main
    autoDeployTrigger: checksPass
    # PR previews off: July bill was ~81% idle preview services (~$79 of ~$97).
    # Re-enable only with a short TTL / manual generation if needed.
    previews:
      generation: manual
    # Accessibility instrumentation is dev-only, but Next typechecks the
    # provider during the production build. Install dev dependencies for the
    # build, then remove them before the standalone runtime is launched.
    buildCommand: npm ci --include=dev && npm run build && npm prune --omit=dev
    # NODE_OPTIONS in envVars (4 GiB) applies to the build, which runs on a
    # larger build machine. At runtime the instance has 512 MB, so cap the V8
    # heap below the container limit — otherwise V8 never collects under
    # pressure and the container OOM-kills the process mid-request (502s).
    startCommand: npm run db:migrate && NODE_OPTIONS=--max-old-space-size=384 npm run start:prod
    healthCheckPath: /api/health
    envVars:
      - key: NODE_OPTIONS
        value: --max-old-space-size=4096
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      # Controls the event suffix emitted by API inngest.send (heavyImageEventName).
      # Jobs matching *.v2 run on adscale-image-worker, not this 512 MB web dyno.
      - key: IMAGE_JOB_TARGET
        value: worker
      - key: IMAGE_ROUTE_CONCURRENCY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: adscale-postgres
          property: connectionString
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: BETTER_AUTH_URL
        value: https://adscale.jhonatansoares.com
      - key: APP_URL
        value: https://adscale.jhonatansoares.com
      - key: MARKETING_URL
        value: https://adscale.jhonatansoares.com/hi
      - key: MARKETING_UPSTREAM_URL
        value: https://adscale-marketing.onrender.com
      - key: MARKETING_ALLOWED_ORIGINS
        value: https://adscale.jhonatansoares.com
      - key: OPENAI_API_KEY
        sync: false
      - key: ATLASCLOUD_API_KEY
        sync: false
      - key: OPENAI_TEXT_MODEL
        value: gpt-5.6
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2-2026-04-21
      - key: OPENAI_IMAGE_SUNBURST_PERCENT
        value: "0"
      - key: OPENAI_IMAGE_SUNBURST_QUALITY
        value: max
      - key: MINIMAX_API_KEY
        sync: false
      - key: MINIMAX_MODEL
        value: MiniMax-M3
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_WAITLIST_SEGMENT_ID
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_STARTER_PRICE_ID
        sync: false
      - key: STRIPE_GROWTH_PRICE_ID
        sync: false
      - key: STRIPE_SCALE_PRICE_ID
        sync: false
      - key: STRIPE_SUCCESS_URL
        value: https://adscale.jhonatansoares.com/settings?tab=billing&checkout=success
      - key: STRIPE_CANCEL_URL
        value: https://adscale.jhonatansoares.com/settings?tab=plans&checkout=cancel
      - key: CREATIVE_WORK_QUALITY_RECOVERY_ENABLED
        value: "false"
      - key: BRAND_CORTEX_SINGLE_PIECE_ENABLED
        value: "false"
      - key: STUDIO_CAROUSEL_ROLLOUT_PERCENT
        value: "100"
      - key: STUDIO_PROGRESSIVE_ROLLOUT_PERCENT
        value: "100"
      - key: PLATFORM_OWNER_EMAILS
        value: jhonatan.marcela@gmail.com

  - type: worker
    name: adscale-image-worker
    runtime: node
    plan: standard
    region: oregon
    rootDir: app
    branch: main
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 300
    buildCommand: npm ci
    startCommand: node --conditions=react-server --import=tsx src/server/jobs/image-worker.ts
    envVars:
      - key: NODE_OPTIONS
        value: --conditions=react-server --max-old-space-size=1536
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: IMAGE_JOB_TARGET
        value: worker
      - key: IMAGE_ROUTE_CONCURRENCY
        value: "2"
      - key: DATABASE_URL
        fromDatabase:
          name: adscale-postgres
          property: connectionString
      - key: APP_URL
        value: https://adscale.jhonatansoares.com
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: BETTER_AUTH_URL
        value: https://adscale.jhonatansoares.com
      - key: OPENAI_API_KEY
        sync: false
      - key: ATLASCLOUD_API_KEY
        sync: false
      - key: OPENAI_TEXT_MODEL
        value: gpt-5.6
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2-2026-04-21
      - key: OPENAI_IMAGE_SUNBURST_PERCENT
        value: "0"
      - key: OPENAI_IMAGE_SUNBURST_QUALITY
        value: max
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET
        sync: false
      - key: R2_PUBLIC_BASE_URL
        sync: false
      - key: INNGEST_EVENT_KEY
        sync: false
      - key: INNGEST_SIGNING_KEY
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: PLATFORM_OWNER_EMAILS
        value: jhonatan.marcela@gmail.com
      - key: MEM0_ENABLED
        sync: false
      - key: MEM0_API_KEY
        sync: false
      - key: MEM0_USER_PREFIX
        sync: false
      - key: MEM0_ORGANIZATION_ID
        sync: false
      - key: MEM0_PROJECT_ID
        sync: false
      - key: STUDIO_CAROUSEL_ROLLOUT_PERCENT
        value: "100"
      - key: STUDIO_PROGRESSIVE_ROLLOUT_PERCENT
        value: "100"

databases:
  - name: adscale-postgres
    databaseName: adscale_db
    user: adscale
    plan: free
    postgresMajorVersion: "16"
    ipAllowList: []

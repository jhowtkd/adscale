name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  checks: write
  statuses: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: adscale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
        with:
          # Convergence gates compare the full PR range against origin/main.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: Run lint
        run: cd app && npm run lint

      - name: Run typecheck
        run: cd app && npm run typecheck

      - name: Convergence gates (anti-expansion + frozen modules)
        run: cd app && npm run convergence:test && npm run convergence:gate

      - name: Run migrations
        run: cd app && npx drizzle-kit migrate
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/adscale_test

      - name: Run tests
        run: cd app && npm test -- --run
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/adscale_test
          NODE_ENV: test

      - name: Reject empty visual-release evidence
        run: cd app && node scripts/check-release-gate.mjs --preflight

      - name: Run build
        run: cd app && npm run build
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/adscale_test
          BETTER_AUTH_SECRET: "01234567890123456789012345678901"
          BETTER_AUTH_URL: http://localhost:3000
          OPENAI_API_KEY: sk-test1234567890123456789012345678901234567890
          OPENAI_TEXT_MODEL: gpt-4o
          OPENAI_IMAGE_MODEL: gpt-image-1
          MINIMAX_API_KEY: minimax-test-key-for-ci-build
          R2_ACCOUNT_ID: test
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_BUCKET: test
          R2_PUBLIC_BASE_URL: https://test.example.com
          INNGEST_EVENT_KEY: test
          INNGEST_SIGNING_KEY: test
          RESEND_API_KEY: re_test_ci_build_placeholder_key
          EMAIL_FROM: "ADScale <onboarding@example.com>"
          APP_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_ci_build_placeholder_key
          STRIPE_WEBHOOK_SECRET: whsec_test_ci_build_placeholder
          STRIPE_STARTER_PRICE_ID: price_starter
          STRIPE_GROWTH_PRICE_ID: price_growth
          STRIPE_SCALE_PRICE_ID: price_scale
          STRIPE_SUCCESS_URL: http://localhost:3000/settings?tab=billing&checkout=success
          STRIPE_CANCEL_URL: http://localhost:3000/settings?tab=plans&checkout=cancel

      - name: Start app for e2e
        run: |
          mkdir -p /tmp/adscale-e2e-storage
          cd app && npm run start &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3000/api/health && break
            sleep 2
          done
          curl -sf http://localhost:3000/api/health
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/adscale_test
          BETTER_AUTH_SECRET: "01234567890123456789012345678901"
          BETTER_AUTH_URL: http://localhost:3000
          OPENAI_API_KEY: sk-test1234567890123456789012345678901234567890
          OPENAI_TEXT_MODEL: gpt-4o
          OPENAI_IMAGE_MODEL: gpt-image-1
          MINIMAX_API_KEY: minimax-test-key-for-ci
          R2_ACCOUNT_ID: test
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_BUCKET: test
          R2_PUBLIC_BASE_URL: https://test.example.com
          INNGEST_EVENT_KEY: test
          INNGEST_SIGNING_KEY: test
          RESEND_API_KEY: re_test_ci
          EMAIL_FROM: "ADScale <onboarding@example.com>"
          APP_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_test_ci
          STRIPE_STARTER_PRICE_ID: price_starter
          STRIPE_GROWTH_PRICE_ID: price_growth
          STRIPE_SCALE_PRICE_ID: price_scale
          STRIPE_SUCCESS_URL: http://localhost:3000/settings?tab=billing&checkout=success
          STRIPE_CANCEL_URL: http://localhost:3000/settings?tab=plans&checkout=cancel
          E2E_DISABLE_RATE_LIMIT: "true"
          E2E_CONTROLLED_PROVIDER: "true"
          E2E_STORAGE_DIR: /tmp/adscale-e2e-storage
          IMAGE_JOB_TARGET: web
          STUDIO_PROGRESSIVE_ROLLOUT_PERCENT: "100"
          STUDIO_ENTRY_INTERVIEW_ROLLOUT_PERCENT: "0"
          INNGEST_BASE_URL: http://127.0.0.1:8288
          NODE_ENV: production

      - name: Start Inngest dev for critical journey
        run: |
          cd app && npx inngest-cli dev -u http://localhost:3000/api/inngest > /tmp/inngest-dev.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8288 >/dev/null && break
            sleep 1
          done
          curl -sf http://127.0.0.1:8288 >/dev/null
        env:
          INNGEST_EVENT_KEY: test
          INNGEST_SIGNING_KEY: test

      - name: Install Playwright browsers
        run: cd app && npx playwright install --with-deps chromium webkit

      - name: Run visual a11y gate
        run: cd app && npx playwright test tests/e2e/visual-a11y-gate.spec.ts
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/adscale_test
          E2E_BASE_URL: http://localhost:3000
          BETTER_AUTH_SECRET: "01234567890123456789012345678901"
          BETTER_AUTH_URL: http://localhost:3000
          OPENAI_API_KEY: sk-test1234567890123456789012345678901234567890
          OPENAI_TEXT_MODEL: gpt-4o
          OPENAI_IMAGE_MODEL: gpt-image-1
          MINIMAX_API_KEY: minimax-test-key-for-ci
          R2_ACCOUNT_ID: test
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_BUCKET: test
          R2_PUBLIC_BASE_URL: https://test.example.com
          INNGEST_EVENT_KEY: test
          INNGEST_SIGNING_KEY: test
          RESEND_API_KEY: re_test_ci
          EMAIL_FROM: "ADScale <onboarding@example.com>"
          APP_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_test_ci
          STRIPE_STARTER_PRICE_ID: price_starter
          STRIPE_GROWTH_PRICE_ID: price_growth
          STRIPE_SCALE_PRICE_ID: price_scale
          STRIPE_SUCCESS_URL: http://localhost:3000/settings?tab=billing&checkout=success
          STRIPE_CANCEL_URL: http://localhost:3000/settings?tab=plans&checkout=cancel
          VISUAL_FOUNDATIONS_SKIP_STORAGE: "true"

      - name: Run visual release layout for carousel and edit
        run: cd app && npx playwright test tests/e2e/visual-release-gate.spec.ts --config playwright.release.config.ts --grep "SCN-STUDIO-CAROUSEL|SCN-STUDIO-EDIT"
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/adscale_test
          E2E_BASE_URL: http://localhost:3000
          BETTER_AUTH_SECRET: "01234567890123456789012345678901"
          BETTER_AUTH_URL: http://localhost:3000
          OPENAI_API_KEY: sk-test1234567890123456789012345678901234567890
          OPENAI_TEXT_MODEL: gpt-4o
          OPENAI_IMAGE_MODEL: gpt-image-1
          MINIMAX_API_KEY: minimax-test-key-for-ci
          R2_ACCOUNT_ID: test
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_BUCKET: test
          R2_PUBLIC_BASE_URL: https://test.example.com
          INNGEST_EVENT_KEY: test
          INNGEST_SIGNING_KEY: test
          RESEND_API_KEY: re_test_ci
          EMAIL_FROM: "ADScale <onboarding@example.com>"
          APP_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_test_ci
          STRIPE_STARTER_PRICE_ID: price_starter
          STRIPE_GROWTH_PRICE_ID: price_growth
          STRIPE_SCALE_PRICE_ID: price_scale
          STRIPE_SUCCESS_URL: http://localhost:3000/settings?tab=billing&checkout=success
          STRIPE_CANCEL_URL: http://localhost:3000/settings?tab=plans&checkout=cancel
          VISUAL_FOUNDATIONS_SKIP_STORAGE: "true"

      - name: Seed critical studio journey
        run: cd app && npm run seed:create-post-e2e
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/adscale_test
          BETTER_AUTH_SECRET: "01234567890123456789012345678901"
          BETTER_AUTH_URL: http://localhost:3000
          OPENAI_API_KEY: sk-test1234567890123456789012345678901234567890
          OPENAI_TEXT_MODEL: gpt-4o
          OPENAI_IMAGE_MODEL: gpt-image-1
          MINIMAX_API_KEY: minimax-test-key-for-ci
          R2_ACCOUNT_ID: test
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_BUCKET: test
          R2_PUBLIC_BASE_URL: https://test.example.com
          INNGEST_EVENT_KEY: test
          INNGEST_SIGNING_KEY: test
          RESEND_API_KEY: re_test_ci
          EMAIL_FROM: "ADScale <onboarding@example.com>"
          APP_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_test_ci
          STRIPE_STARTER_PRICE_ID: price_starter
          STRIPE_GROWTH_PRICE_ID: price_growth
          STRIPE_SCALE_PRICE_ID: price_scale
          STRIPE_SUCCESS_URL: http://localhost:3000/settings?tab=billing&checkout=success
          STRIPE_CANCEL_URL: http://localhost:3000/settings?tab=plans&checkout=cancel
          E2E_CONTROLLED_PROVIDER: "true"
          E2E_STORAGE_DIR: /tmp/adscale-e2e-storage
          IMAGE_JOB_TARGET: web

      - name: Run critical studio journey
        run: cd app && npx playwright test tests/e2e/first-studio-piece.spec.ts tests/e2e/critical-studio-journey.spec.ts --project=serial-flows
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/adscale_test
          E2E_BASE_URL: http://localhost:3000
          BETTER_AUTH_SECRET: "01234567890123456789012345678901"
          BETTER_AUTH_URL: http://localhost:3000
          OPENAI_API_KEY: sk-test1234567890123456789012345678901234567890
          OPENAI_TEXT_MODEL: gpt-4o
          OPENAI_IMAGE_MODEL: gpt-image-1
          MINIMAX_API_KEY: minimax-test-key-for-ci
          R2_ACCOUNT_ID: test
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_BUCKET: test
          R2_PUBLIC_BASE_URL: https://test.example.com
          INNGEST_EVENT_KEY: test
          INNGEST_SIGNING_KEY: test
          RESEND_API_KEY: re_test_ci
          EMAIL_FROM: "ADScale <onboarding@example.com>"
          APP_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_ci
          STRIPE_WEBHOOK_SECRET: whsec_test_ci
          STRIPE_STARTER_PRICE_ID: price_starter
          STRIPE_GROWTH_PRICE_ID: price_growth
          STRIPE_SCALE_PRICE_ID: price_scale
          STRIPE_SUCCESS_URL: http://localhost:3000/settings?tab=billing&checkout=success
          STRIPE_CANCEL_URL: http://localhost:3000/settings?tab=plans&checkout=cancel
          E2E_CONTROLLED_PROVIDER: "true"
          E2E_DISABLE_RATE_LIMIT: "true"
          E2E_STORAGE_DIR: /tmp/adscale-e2e-storage
          IMAGE_JOB_TARGET: web
          STUDIO_PROGRESSIVE_ROLLOUT_PERCENT: "100"
          STUDIO_ENTRY_INTERVIEW_ROLLOUT_PERCENT: "0"
          VISUAL_FOUNDATIONS_SKIP_STORAGE: "true"


name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./app

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: adscale_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5433:5432

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: ./app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run linter
        run: npm run lint

      - name: Run type check
        run: npx tsc --noEmit --pretty false

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgres://test:test@localhost:5433/adscale_test
          BETTER_AUTH_SECRET: test-test-test-test-test-test-test-test
          BETTER_AUTH_URL: http://localhost:3000
          OPENAI_API_KEY: sk-test-key-for-ci-only
          OPENAI_TEXT_MODEL: gpt-5-mini
          OPENAI_IMAGE_MODEL: gpt-image-2-2026-04-21
          R2_ACCOUNT_ID: test
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_BUCKET: test
          R2_PUBLIC_BASE_URL: https://test.r2.dev
          INNGEST_EVENT_KEY: local
          INNGEST_SIGNING_KEY: local
          RESEND_API_KEY: re_test
          EMAIL_FROM: test@test.com
          APP_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_test
          STRIPE_WEBHOOK_SECRET: whsec_test
          STRIPE_STARTER_PRICE_ID: price_test
          STRIPE_GROWTH_PRICE_ID: price_test
          STRIPE_SCALE_PRICE_ID: price_test
          STRIPE_SUCCESS_URL: http://localhost:3000/settings?tab=billing&checkout=success
          STRIPE_CANCEL_URL: http://localhost:3000/settings?tab=plans&checkout=cancel

      - name: Build
        run: npm run build
        env:
          NODE_ENV: production

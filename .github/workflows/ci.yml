name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: adscale_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install dependencies
        run: cd app && npm ci

      - name: Run lint
        run: cd app && npm run lint

      - name: Run typecheck
        run: cd app && npm run typecheck

      - name: Convergence gates (anti-expansion + frozen modules)
        run: cd app && npm run convergence:gate
        env:
          # Bootstrap bypass: this PR introduces the freeze manifest for the
          # first time, so base (origin/main) does not yet carry it. Once the
          # manifest lands on main, remove this env var so the gate enforces.
          PRIMARY_DESTINATIONS_ALLOW_BOOTSTRAP: "1"

      - name: Run migrations
        run: cd app && npx drizzle-kit migrate
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/adscale_test

      - name: Run tests
        run: cd app && npm test -- --run
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/adscale_test
          NODE_ENV: test

      - name: Run build
        run: cd app && npm run build
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/adscale_test
          BETTER_AUTH_SECRET: "01234567890123456789012345678901"
          BETTER_AUTH_URL: http://localhost:3000
          OPENAI_API_KEY: sk-test1234567890123456789012345678901234567890
          OPENAI_TEXT_MODEL: gpt-4o
          OPENAI_IMAGE_MODEL: gpt-image-1
          MINIMAX_API_KEY: minimax-test-key-for-ci-build
          R2_ACCOUNT_ID: test
          R2_ACCESS_KEY_ID: test
          R2_SECRET_ACCESS_KEY: test
          R2_BUCKET: test
          R2_PUBLIC_BASE_URL: https://test.example.com
          INNGEST_EVENT_KEY: test
          INNGEST_SIGNING_KEY: test
          RESEND_API_KEY: re_test_ci_build_placeholder_key
          EMAIL_FROM: "ADScale <onboarding@example.com>"
          APP_URL: http://localhost:3000
          STRIPE_SECRET_KEY: sk_test_ci_build_placeholder_key
          STRIPE_WEBHOOK_SECRET: whsec_test_ci_build_placeholder
          STRIPE_STARTER_PRICE_ID: price_starter
          STRIPE_GROWTH_PRICE_ID: price_growth
          STRIPE_SCALE_PRICE_ID: price_scale
          STRIPE_SUCCESS_URL: http://localhost:3000/settings?tab=billing&checkout=success
          STRIPE_CANCEL_URL: http://localhost:3000/settings?tab=plans&checkout=cancel

      - name: Start app for e2e
        run: |
          cd app && npm run start &
          sleep 5
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/adscale_test
          BETTER_AUTH_SECRET: "01234567890123456789012345678901"
          BETTER_AUTH_URL: http://localhost:3000
          APP_URL: http://localhost:3000
          NODE_ENV: production

      - name: Install Playwright browsers
        run: cd app && npx playwright install --with-deps chromium

      - name: Run v6 preview a11y gate
        continue-on-error: true
        run: cd app && npx playwright test --grep "v6 preview a11y gate"
        env:
          DATABASE_URL: postgres://test:test@localhost:5432/adscale_test
          E2E_BASE_URL: http://localhost:3000

<svg xmlns="http://www.w3.org/2000/svg" width="200" height="160" viewBox="0 0 200 160" fill="none">
  <!-- Background glow -->
  <circle cx="100" cy="80" r="60" fill="rgba(99,102,241,0.06)"/>

  <!-- Main canvas/frame -->
  <rect x="60" y="45" width="80" height="70" rx="8" fill="var(--surface-base, #111827)" stroke="var(--border-medium, #2a364a)" stroke-width="1.5"/>

  <!-- Ad frame inside -->
  <rect x="72" y="57" width="56" height="40" rx="4" fill="rgba(99,102,241,0.08)" stroke="var(--accent-blue, #6366f1)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Text lines inside ad frame -->
  <rect x="80" y="65" width="30" height="3" rx="1.5" fill="var(--text-muted, #475569)" opacity="0.5"/>
  <rect x="80" y="72" width="24" height="3" rx="1.5" fill="var(--text-muted, #475569)" opacity="0.3"/>
  <rect x="80" y="79" width="36" height="3" rx="1.5" fill="var(--text-muted, #475569)" opacity="0.4"/>

  <!-- CTA button inside frame -->
  <rect x="80" y="88" width="20" height="5" rx="2.5" fill="rgba(99,102,241,0.2)"/>

  <!-- Floating creative elements around the canvas -->
  <!-- Shape 1: circle (top-left) -->
  <circle cx="45" cy="55" r="8" fill="rgba(99,102,241,0.1)" stroke="var(--accent-blue, #6366f1)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Shape 2: square (top-right) -->
  <rect x="148" y="48" width="14" height="14" rx="3" fill="rgba(20,184,166,0.08)" stroke="var(--accent-teal, #14b8a6)" stroke-width="1" stroke-opacity="0.3" transform="rotate(15 155 55)"/>

  <!-- Shape 3: text block (bottom-left) -->
  <rect x="42" y="108" width="22" height="8" rx="4" fill="var(--surface-raised, #1a2235)" stroke="var(--border-dim, #1e293b)" stroke-width="1"/>
  <rect x="46" y="112" width="14" height="2" rx="1" fill="var(--text-muted, #475569)" opacity="0.4"/>

  <!-- Shape 4: color swatch (bottom-right) -->
  <rect x="142" y="105" width="16" height="16" rx="4" fill="rgba(167,139,250,0.1)" stroke="var(--accent-purple, #a78bfa)" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="145" y="108" width="10" height="4" rx="2" fill="var(--accent-purple, #a78bfa)" opacity="0.3"/>
  <rect x="145" y="114" width="6" height="4" rx="2" fill="var(--accent-teal, #14b8a6)" opacity="0.3"/>

  <!-- Shape 5: small triangle (right) -->
  <polygon points="155,75 162,88 148,88" fill="rgba(245,158,11,0.08)" stroke="var(--accent-amber, #f59e0b)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Dashed connection lines -->
  <path d="M53 55 Q60 50 68 53" stroke="var(--border-medium, #2a364a)" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <path d="M148 55 Q142 52 138 58" stroke="var(--border-medium, #2a364a)" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
  <path d="M64 112 Q68 108 72 105" stroke="var(--border-medium, #2a364a)" stroke-width="1" stroke-dasharray="3 3" fill="none"/>
</svg>

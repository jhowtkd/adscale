<svg xmlns="http://www.w3.org/2000/svg" width="200" height="160" viewBox="0 0 200 160" fill="none">
  <!-- Background glow -->
  <ellipse cx="100" cy="80" rx="70" ry="50" fill="rgba(167,139,250,0.05)"/>

  <!-- Base image (back layer) -->
  <rect x="55" y="50" width="70" height="60" rx="8" fill="var(--surface-base, #111827)" stroke="var(--border-medium, #2a364a)" stroke-width="1.5"/>

  <!-- Image content -->
  <rect x="62" y="58" width="56" height="36" rx="4" fill="rgba(99,102,241,0.08)"/>
  <circle cx="78" cy="72" r="8" fill="rgba(99,102,241,0.12)"/>
  <rect x="90" y="66" width="22" height="3" rx="1.5" fill="var(--text-muted, #475569)" opacity="0.4"/>
  <rect x="90" y="72" width="18" height="3" rx="1.5" fill="var(--text-muted, #475569)" opacity="0.25"/>

  <!-- CTA bar -->
  <rect x="62" y="100" width="56" height="6" rx="3" fill="rgba(99,102,241,0.15)"/>

  <!-- Derivation layer 1 (middle, offset) -->
  <rect x="72" y="42" width="70" height="60" rx="8" fill="var(--surface-base, #111827)" stroke="var(--accent-purple, #a78bfa)" stroke-width="1" stroke-opacity="0.3" opacity="0.7"/>
  <rect x="79" y="50" width="56" height="36" rx="4" fill="rgba(167,139,250,0.06)"/>
  <rect x="79" y="92" width="56" height="6" rx="3" fill="rgba(167,139,250,0.12)"/>

  <!-- Derivation layer 2 (front, further offset) -->
  <rect x="88" y="34" width="58" height="50" rx="8" fill="var(--surface-base, #111827)" stroke="var(--accent-blue, #6366f1)" stroke-width="1" stroke-opacity="0.3" opacity="0.5"/>
  <rect x="93" y="40" width="48" height="30" rx="4" fill="rgba(99,102,241,0.05)"/>
  <rect x="93" y="76" width="48" height="5" rx="2.5" fill="rgba(99,102,241,0.1)"/>

  <!-- Floating sparkles/AI indicators -->
  <circle cx="48" cy="50" r="4" fill="rgba(167,139,250,0.15)" stroke="var(--accent-purple, #a78bfa)" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="155" cy="45" r="3" fill="rgba(99,102,241,0.12)" stroke="var(--accent-blue, #6366f1)" stroke-width="1" stroke-opacity="0.3"/>
  <circle cx="50" cy="105" r="3.5" fill="rgba(20,184,166,0.1)" stroke="var(--accent-teal, #14b8a6)" stroke-width="1" stroke-opacity="0.3"/>

  <!-- Sparkle icon -->
  <path d="M155 85 L156.5 88.5 L160 90 L156.5 91.5 L155 95 L153.5 91.5 L150 90 L153.5 88.5 Z" fill="rgba(245,158,11,0.2)" stroke="var(--accent-amber, #f59e0b)" stroke-width="0.8" stroke-opacity="0.4"/>

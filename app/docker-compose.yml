version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: adscale-postgres
    environment:
      POSTGRES_USER: adscale
      POSTGRES_PASSWORD: adscale123
      POSTGRES_DB: adscale_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U adscale -d adscale_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    env_file:
      - .env.docker
    environment:
      - NODE_ENV=production
      - INNGEST_DEV=http://inngest:8288
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  inngest:
    image: inngest/inngest:latest
    command: ["inngest", "dev", "-u", "http://app:3000/api/inngest"]
    ports:
      - "8288:8288"
    depends_on:
      - app
    restart: unless-stopped
    profiles:
      - dev

volumes:
  postgres_data:
